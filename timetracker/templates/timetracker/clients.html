{% extends "timetracker/base.html" %}

{% block content %}
<h2>Clients</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Add Client</button>
</form>

<hr>

<h3>Your Clients</h3>

<ul>
    {% for client in clients %}
        <li>{{ client.name }} - ${{ client.hourly_rate }}/hr</li>
    {% empty %}
        <li>No clients added yet.</li>
    {% endfor %}
</ul>
{% endblock %}
